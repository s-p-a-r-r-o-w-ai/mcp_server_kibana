[project]
name = "mcp-server-kibana"
version = "0.1.0"
description = "MCP server for Kibana REST API endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "typing-extensions>=4.5.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
mcp-server-kibana = "mcp_server_kibana.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_kibana"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []


