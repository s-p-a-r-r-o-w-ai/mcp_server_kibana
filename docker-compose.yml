services:
  mcp-server:
    build: .
    image: mcp-kibana:latest
    container_name: mcp-kibana-server
    ports:
      - "8080:8080"
    environment:
      KIBANA_URL: ${KIBANA_URL}
      KIBANA_API_KEY: ${KIBANA_API_KEY}
      MCP_API_KEY: ${MCP_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped